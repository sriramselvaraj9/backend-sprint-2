<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film Search | Film Review Platform</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Official htmx CDN -->
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg-base: #0b0f19;
            --bg-surface: #111827;
            --bg-card: rgba(17, 24, 39, 0.8);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(99, 102, 241, 0.5);
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.25);
            --accent-amber: #f59e0b;
            --accent-emerald: #10b981;
            --font-display: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-full: 9999px;
            --shadow-card: 0 10px 30px -10px rgba(0, 0, 0, 0.5), 0 0 1px 1px var(--border-subtle);
            --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.15), transparent),
                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(139, 92, 246, 0.08), transparent);
            color: var(--text-primary);
            font-family: var(--font-body);
            min-height: 100vh;
            padding: 2.5rem 1.25rem 4rem;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        /* Header section */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.9rem;
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: var(--radius-full);
            color: #a5b4fc;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .badge-pill .pulse-dot {
            width: 7px;
            height: 7px;
            background-color: #818cf8;
            border-radius: 50%;
            box-shadow: 0 0 8px #818cf8;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        h1 {
            font-family: var(--font-display);
            font-size: clamp(2rem, 5vw, 2.75rem);
            font-weight: 800;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #ffffff 40%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.75rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.05rem;
            max-width: 580px;
            margin: 0 auto;
        }

        /* Search input bar */
        .search-wrapper {
            position: relative;
            margin: 0 auto 2.5rem;
            max-width: 680px;
        }

        .search-icon {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            width: 22px;
            height: 22px;
            transition: var(--transition-smooth);
        }

        .search-input {
            width: 100%;
            padding: 1.1rem 3.5rem 1.1rem 3.25rem;
            font-family: var(--font-body);
            font-size: 1.05rem;
            color: var(--text-primary);
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            outline: none;
            box-shadow: var(--shadow-card);
            transition: var(--transition-smooth);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow), var(--shadow-card);
            background: rgba(22, 30, 49, 0.95);
        }

        .search-input:focus ~ .search-icon {
            color: var(--primary);
        }

        .spinner {
            position: absolute;
            right: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            border: 2px solid rgba(99, 102, 241, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        .htmx-request.spinner,
        .htmx-request .spinner {
            display: block;
        }

        @keyframes spin {
            to { transform: translateY(-50%) rotate(360deg); }
        }

        /* Results container */
        .results-container {
            position: relative;
            min-height: 240px;
        }

        /* Initial prompt & empty state */
        .initial-prompt,
        .no-results-state {
            text-align: center;
            padding: 4rem 1.5rem;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px dashed var(--border-subtle);
            border-radius: var(--radius-lg);
            color: var(--text-secondary);
            box-shadow: var(--shadow-card);
        }

        .prompt-icon,
        .empty-icon {
            font-size: 2.75rem;
            margin-bottom: 1rem;
            display: inline-block;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
        }

        .initial-prompt h2,
        .no-results-state h2 {
            font-family: var(--font-display);
            font-size: 1.35rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .initial-prompt p,
        .no-results-state p {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .highlight {
            color: #c7d2fe;
            font-weight: 600;
        }

        /* Summary header */
        .results-summary {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 1.25rem;
            padding-left: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Film cards grid */
        .film-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
        }

        .film-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow-card);
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }

        .film-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), #a855f7);
            opacity: 0;
            transition: var(--transition-smooth);
        }

        .film-card:hover {
            transform: translateY(-4px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 16px 36px -12px rgba(0, 0, 0, 0.7), 0 0 1px 1px rgba(99, 102, 241, 0.3);
        }

        .film-card:hover::before {
            opacity: 1;
        }

        .film-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .film-title {
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .film-year {
            font-size: 0.8rem;
            font-weight: 700;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.2rem 0.55rem;
            border-radius: var(--radius-sm);
            white-space: nowrap;
        }

        .film-meta {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .genre-badge {
            display: inline-block;
            align-self: flex-start;
            font-size: 0.75rem;
            font-weight: 600;
            color: #a5b4fc;
            background: rgba(99, 102, 241, 0.14);
            border: 1px solid rgba(99, 102, 241, 0.25);
            padding: 0.2rem 0.6rem;
            border-radius: var(--radius-full);
            letter-spacing: 0.02em;
        }

        .film-director {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .film-director strong {
            color: #e2e8f0;
            font-weight: 500;
        }

        /* Rating box */
        .rating-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 0.9rem;
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
            margin-top: auto;
        }

        .rating-box.rated {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.25);
            color: #fef3c7;
        }

        .rating-box.unrated {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--text-muted);
        }

        .rating-content {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .star-icon {
            color: var(--accent-amber);
            font-size: 1.05rem;
            line-height: 1;
        }

        .rating-value {
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .review-count {
            font-size: 0.75rem;
            color: #d97706;
            font-weight: 500;
        }

        .unrated-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Responsive */
        @media (max-width: 640px) {
            body {
                padding: 1.5rem 1rem 3rem;
            }
            .header {
                margin-bottom: 2rem;
            }
            .search-input {
                padding: 0.95rem 3rem 0.95rem 2.85rem;
                font-size: 0.95rem;
            }
            .film-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="badge-pill">
                <span class="pulse-dot"></span>
                <span>FastAPI + Jinja2 + htmx</span>
            </div>
            <h1>Film Search</h1>
            <p class="subtitle">Search and discover films across the platform in real time with dynamic server-rendered HTML fragments.</p>
        </header>

        <!-- Search Input with htmx attributes -->
        <section class="search-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input 
                type="text" 
                name="q" 
                id="search-input"
                class="search-input" 
                placeholder="Search films by title (e.g., Inception, Matrix, Interstellar)..." 
                hx-get="/ui/films/search" 
                hx-trigger="input changed delay:300ms" 
                hx-target="#film-results" 
                hx-swap="innerHTML" 
                hx-indicator="#search-spinner" 
                aria-label="Search films by title"
                autocomplete="off"
                autofocus
            />
            <div id="search-spinner" class="spinner"></div>
        </section>

        <!-- Dynamic Results Container -->
        <main id="film-results" class="results-container">
            <div class="initial-prompt">
                <div class="prompt-icon">🎬</div>
                <h2>Start typing to search</h2>
                <p>Type any film title above to search the catalogue in real time.</p>
            </div>
        </main>
    </div>
</body>
</html>
