[project]
name = "day4"
version = "0.1.0"
description = "Film Review Platform - Day 4"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.44.0",
    "pydantic>=2.14.3",
]

[tool.pyrefly]
search-path = ["backend", "shared-pre-deployment/src"]
search_path = ["backend", "shared-pre-deployment/src"]

[tool.pyright]
extraPaths = ["backend", "shared-pre-deployment/src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "unit: Pure unit tests requiring no external infrastructure (no DB, Redis, HTTP)",
    "integration: Integration tests exercising routes, services, DAOs, and database",
]
